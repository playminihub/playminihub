<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PlayMiniHub - Free HTML5 Games</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      text-align:center;
    }

    header{
      padding:30px;
      background:#111827;
      font-size:32px;
      font-weight:bold;
    }

    .hero{
      padding:60px 20px;
    }

    .hero h1{
      font-size:48px;
      margin-bottom:20px;
    }

    .hero p{
      font-size:20px;
      color:#cbd5e1;
    }

    .games{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:40px;
    }

    .card{
      background:#1e293b;
      border-radius:12px;
      padding:20px;
    }

    .card h3{
      margin-top:0;
    }

    button{
      background:#3b82f6;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
    }

    footer{
      padding:30px;
      background:#111827;
      margin-top:40px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

<header>
  PlayMiniHub
</header>

<section class="hero">
  <h1>Free Online HTML5 Games</h1>
  <p>Play fun games directly in your browser on mobile and desktop.</p>
</section>

<section class="games">

  <div class="card">
    <h3>Car Racing</h3>
    <p>Drive fast and avoid obstacles.</p>
    <button>Play Now</button>
  </div>

  <div class="card">
    <h3>Space Shooter</h3>
    <p>Destroy enemy ships and survive.</p>
    <button>Play Now</button>
  </div>

  <div class="card">
    <h3>Puzzle Match</h3>
    <p>Match blocks and earn points.</p>
    <button>Play Now</button>
  </div>

</section>

<footer>
  © 2026 PlayMiniHub - All Rights Reserved
</footer>

</body>
</html>
