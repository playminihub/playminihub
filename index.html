<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PlayMiniHub</title>

  <style>
    body{
      margin:0;
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
    }

    h1{
      margin-top:40px;
      font-size:48px;
    }

    .games{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:50px;
      flex-wrap:wrap;
    }

    .card{
      width:220px;
      background:#222;
      border-radius:12px;
      padding:20px;
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.05);
      background:#333;
    }

    a{
      color:white;
      text-decoration:none;
    }

    button{
      margin-top:15px;
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#00b894;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>PlayMiniHub</h1>

<p>Free Online HTML5 Games</p>

<div class="games">

  <div class="card">
    <h2>Flappy Bird</h2>
    <a href="/game1/">
      <button>Play Now</button>
    </a>
  </div>

</div>

</body>
</html>
